name: CI

on:
  pull_request:
  push:
    branches: [main, fcm-integration]

permissions:
  contents: read

jobs:
  fcm-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure portable contract
        run: cmake -S . -B build-contract -DXSCAL_BUILD_NATIVE=OFF -DXSCAL_BUILD_FCM_CONTRACT_TESTS=ON
      - name: Build
        run: cmake --build build-contract --parallel
      - name: Test
        run: ctest --test-dir build-contract --output-on-failure

  native-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure native xScal
        run: cmake -S . -B build -A x64 -DXSCAL_BUILD_NATIVE=ON -DXSCAL_BUILD_FCM_CONTRACT_TESTS=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload native test artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: xscal-windows-x64
          path: build/Release/dxgi.dll
          if-no-files-found: error
